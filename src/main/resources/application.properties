# ==========================================
# Application
# ==========================================
spring.application.name=spring-rag
server.port=8080
server.servlet.context-path=/v1

# ==========================================
# Logging
# ==========================================
logging.pattern.console=%clr(%d{HH:mm:ss}){green} %clr([%thread]){magenta} %clr(%-5level){red} %clr([%class.%method]){cyan} - %clr(%msg){yellow}%n

logging.level.root=INFO
logging.level.org.springframework.ai=INFO
logging.level.org.springframework.ai.rag=INFO

# ==========================================
# Spring AI - Ollama
# ==========================================
spring.ai.chat.client.enabled=false

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=mistral:7b
spring.ai.ollama.chat.options.timeout=30s
spring.ai.ollama.chat.options.max-tokens=300

# Embedding model: 1024 dimensions
spring.ai.ollama.embedding.model=bge-m3:567m

# ==========================================
# PostgreSQL
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=spring_rag
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Spring AI - PGVector
# ==========================================
spring.ai.vectorstore.pgvector.schema-name=spring_rag
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.initialize-schema=false

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true